<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<title>Télé tactile · caméra</title>
<style>
  :root {
    --bg: #1b1e23;
    --panel: #252a31;
    --line: #3a414b;
    --text: #eef1f5;
    --muted: #a3acb8;
    --accent: #5aa9e6;
    --ok: #6fcf97;
    --bad: #ff8a80;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f4f7; --panel: #ffffff; --line: #d3d9e0;
      --text: #1b1e23; --muted: #5d6673; --accent: #1f6fb2;
      --ok: #1f8a4c; --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 34rem; margin: 0 auto; padding: 1.25rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  p.lead { margin: 0 0 1.25rem; color: var(--muted); }
  label { display: block; margin-bottom: .9rem; font-weight: 600; }
  input, select {
    display: block; width: 100%; margin-top: .35rem; padding: .8rem .9rem;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: .75rem; }
  .row > label { flex: 1; }
  .row > label.narrow { flex: 0 0 6.5rem; }
  button, a.btn {
    display: inline-block; padding: .85rem 1.2rem; font: inherit; font-weight: 600;
    color: #0e1217; background: var(--accent); border: 0; border-radius: 8px;
    text-decoration: none; cursor: pointer;
  }
  button.ghost, a.btn.ghost { color: var(--text); background: transparent; border: 1px solid var(--line); }
  button.full { width: 100%; }
  #msg { min-height: 1.5rem; margin: .9rem 0 0; color: var(--muted); }
  #msg.bad { color: var(--bad); }
  #cert { margin-top: .75rem; }
  #live { display: none; position: fixed; inset: 0; background: #000; }
  #live video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    padding: .75rem .9rem calc(.75rem + env(safe-area-inset-bottom));
    background: rgba(27, 30, 35, .88);
  }
  #bar select { width: auto; margin: 0; padding: .55rem .6rem; }
  #bar button { padding: .6rem .9rem; }
  #state { flex: 1 1 100%; color: var(--text); font-size: .95rem; }
  #state .dot { display: inline-block; width: .65rem; height: .65rem; margin-right: .45rem; border-radius: 50%; background: var(--bad); }
  #state.on .dot { background: var(--ok); }
  #fps { color: var(--muted); margin-left: auto; font-size: .9rem; }
</style>
</head>
<body>

<main id="connect">
  <h1>Caméra de la télé tactile</h1>
  <p class="lead">Pose le téléphone au ras du bas de la télé, caméra vers le haut. Saisis l’adresse affichée par le PC.</p>

  <label for="ip">Adresse IP du PC
    <input id="ip" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.20">
  </label>
  <div class="row">
    <label for="port" class="narrow">Port
      <input id="port" inputmode="numeric" value="8443">
    </label>
    <label for="res">Résolution envoyée
      <select id="res">
        <option value="480">480 px, très fluide</option>
        <option value="640" selected>640 px, équilibré</option>
        <option value="960">960 px, plus précis</option>
      </select>
    </label>
  </div>
  <button id="go" class="full" type="button">Connecter</button>
  <p id="msg" role="status"></p>
  <a id="cert" class="btn ghost" hidden target="_blank" rel="noopener">Autoriser le certificat du PC</a>
</main>

<section id="live" aria-label="Caméra en direct">
  <video id="v" playsinline muted autoplay></video>
  <div id="bar">
    <div id="state"><span class="dot"></span><span id="stateText">Connexion…</span></div>
    <button id="flip" class="ghost" type="button">Changer de caméra</button>
    <select id="res2" aria-label="Résolution envoyée">
      <option value="480">480 px</option>
      <option value="640">640 px</option>
      <option value="960">960 px</option>
    </select>
    <button id="stop" class="ghost" type="button">Arrêter</button>
    <span id="fps"></span>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ipEl = $('ip'), portEl = $('port'), resEl = $('res'), res2El = $('res2');
  const msg = $('msg'), cert = $('cert'), v = $('v');

  let ws = null, stream = null, running = false, facing = 'environment';
  let busy = false, sent = 0, wake = null, retryTimer = null;
  const cv = document.createElement('canvas');
  const cx = cv.getContext('2d');

  // Valeurs mémorisées, ou adresse du PC si la page est servie par le PC lui-même.
  try {
    ipEl.value = localStorage.getItem('tt_ip') || '';
    portEl.value = localStorage.getItem('tt_port') || '8443';
    resEl.value = localStorage.getItem('tt_res') || '640';
  } catch (e) {}
  if (/^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) {
    ipEl.value = location.hostname;
    if (location.port) portEl.value = location.port;
  }
  res2El.value = resEl.value;

  const say = (t, bad) => { msg.textContent = t; msg.className = bad ? 'bad' : ''; };

  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
    });
    v.srcObject = stream;
    await v.play();
  }

  function setState(on, text) {
    $('state').className = on ? 'on' : '';
    $('stateText').textContent = text;
  }

  function openSocket() {
    const ip = ipEl.value.trim(), port = portEl.value.trim() || '8443';
    const url = 'wss://' + ip + ':' + port + '/ws';
    setState(false, 'Connexion à ' + ip + '…');
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    const timeout = setTimeout(() => { if (ws && ws.readyState !== 1) ws.close(); }, 6000);
    ws.onopen = () => { clearTimeout(timeout); setState(true, 'Connecté au PC'); };
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === 'status') setState(true, m.text);
      } catch (err) {}
    };
    ws.onclose = () => {
      clearTimeout(timeout);
      if (!running) return;
      setState(false, 'Connexion perdue, nouvel essai…');
      retryTimer = setTimeout(openSocket, 2000);
    };
    ws.onerror = () => {};
  }

  function pump() {
    if (!running) return;
    if (ws && ws.readyState === 1 && v.videoWidth && !busy && ws.bufferedAmount < 400000) {
      const w = parseInt(res2El.value, 10);
      const h = Math.round(w * v.videoHeight / v.videoWidth);
      cv.width = w; cv.height = h;
      cx.drawImage(v, 0, 0, w, h);
      busy = true;
      cv.toBlob(b => {
        if (b && ws && ws.readyState === 1) b.arrayBuffer().then(buf => { ws.send(buf); sent++; });
        busy = false;
      }, 'image/jpeg', 0.72);
    }
    if ('requestVideoFrameCallback' in v) v.requestVideoFrameCallback(pump);
    else setTimeout(pump, 33);
  }

  async function connect() {
    const ip = ipEl.value.trim();
    if (!ip) { say('Saisis l’adresse IP affichée par le PC.', true); return; }
    try {
      localStorage.setItem('tt_ip', ip);
      localStorage.setItem('tt_port', portEl.value.trim());
      localStorage.setItem('tt_res', resEl.value);
    } catch (e) {}
    res2El.value = resEl.value;
    say('Ouverture de la caméra…');
    try {
      await startCamera();
    } catch (e) {
      say('Caméra refusée ou indisponible. Autorise la caméra pour ce site, puis réessaie.', true);
      return;
    }
    // Test de connexion avant d’afficher la vue en direct
    say('Connexion au PC…');
    const port = portEl.value.trim() || '8443';
    const ok = await new Promise(resolve => {
      const t = new WebSocket('wss://' + ip + ':' + port + '/ws');
      const to = setTimeout(() => { try { t.close(); } catch (e) {} resolve(false); }, 6000);
      t.onopen = () => { clearTimeout(to); t.close(); resolve(true); };
      t.onerror = () => { clearTimeout(to); resolve(false); };
    });
    if (!ok) {
      stream.getTracks().forEach(t => t.stop());
      say('Connexion impossible. Vérifie l’adresse, que le serveur tourne, et que le certificat du PC est accepté.', true);
      cert.href = 'https://' + ip + ':' + port + '/';
      cert.hidden = false;
      return;
    }
    cert.hidden = true;
    $('connect').style.display = 'none';
    $('live').style.display = 'block';
    running = true;
    try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    openSocket();
    pump();
  }

  function stop() {
    running = false;
    clearTimeout(retryTimer);
    if (ws) ws.close();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (wake) { wake.release().catch(() => {}); wake = null; }
    $('live').style.display = 'none';
    $('connect').style.display = 'block';
    say('Arrêté.');
  }

  $('go').addEventListener('click', connect);
  [ipEl, portEl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); }));
  $('stop').addEventListener('click', stop);
  $('flip').addEventListener('click', async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await startCamera(); } catch (e) {}
  });
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible') {
      try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  });
  setInterval(() => { $('fps').textContent = running ? sent + ' img/s' : ''; sent = 0; }, 1000);
})();
</script>
</body>
</html>
